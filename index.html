<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kids&You Store</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body { font-family: sans-serif; text-align: center; padding: 30px; background-color: #ffffff; }
h1 { color: #2481cc; }
.card { border: 1px solid #e0e0e0; border-radius: 12px; padding: 20px; margin: 20px 0; background: #f9f9f9; }
</style>
</head>
<body>
<h1>Kids&You Store</h1>
<p id="user">Loading profile...</p>

<div class="card">
<h3>Welcome to Kids&You Store!</h3>
<p>Browse toys, clothes, and accessories directly inside Telegram.</p>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();
if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
document.getElementById('user').innerText = 'Hello, ' + tg.initDataUnsafe.user.first_name + '!';
}
</script>
</body>
</html>
