<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kids&amp;You Store</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body { font-family: sans-serif; margin: 0; padding: 16px; background: #fff; }
h1 { color: #2481cc; text-align: center; margin: 8px 0; }
#user { text-align: center; margin: 0 0 16px; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.card { border: 1px solid #e0e0e0; border-radius: 12px; padding: 12px; background: #f9f9f9; text-align: center; }
.emoji { font-size: 48px; }
.name { font-weight: bold; margin: 6px 0 2px; }
.price { color: #2481cc; margin-bottom: 8px; }
button { background: #2481cc; color: #fff; border: 0; border-radius: 8px; padding: 8px 14px; font-size: 14px; }
#cart { position: sticky; bottom: 0; background: #fff; border-top: 1px solid #e0e0e0; margin-top: 16px; padding: 12px; text-align: center; font-weight: bold; }
</style>
</head>
<body>
<h1>Kids&amp;You Store</h1>
<p id="user">Loading profile...</p>
<div class="grid" id="products"></div>
<div id="cart">Cart: 0 items - $0.00</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();
if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
  document.getElementById('user').innerText = 'Hello, ' + tg.initDataUnsafe.user.first_name + '!';
}

const products = [
  { name: 'Toy Car', price: 5.50, emoji: '🚗' },
  { name: 'Teddy Bear', price: 12.00, emoji: '🧸' },
  { name: 'Kids T-Shirt', price: 8.00, emoji: '👕' },
  { name: 'Baby Shoes', price: 10.00, emoji: '👟' },
  { name: 'School Bag', price: 15.00, emoji: '🎒' },
  { name: 'Building Blocks', price: 9.50, emoji: '🧱' }
];

let count = 0, total = 0;
const list = document.getElementById('products');
products.forEach(function (p) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = '<div class="emoji">' + p.emoji + '</div>' +
    '<div class="name">' + p.name + '</div>' +
    '<div class="price">$' + p.price.toFixed(2) + '</div>';
  const btn = document.createElement('button');
  btn.textContent = 'Add';
  btn.onclick = function () {
    count++;
    total += p.price;
    document.getElementById('cart').innerText = 'Cart: ' + count + ' items - $' + total.toFixed(2);
  };
  card.appendChild(btn);
  list.appendChild(card);
});
</script>
</body>
</html>
